name: Research pipeline validation

on:
  push:
    branches:
      - main
      - engineering/p1-data-integrity
      - engineering/foundation-audit
      - cursor/research-paper-milestone-6762
      - cursor/honest-edge-m2-6762
      - cursor/kronos-patch-layer-m3-6762
      - cursor/aranha-digital-ce63
      - cursor/crypto-crawler-ce63
      - cursor/chart-dashboard-ce63
  pull_request:
    branches:
      - main
      - engineering/foundation-audit
      - engineering/p1-data-integrity

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline research validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run offline tests
        run: npm test

      - name: Build research application
        run: npm run build

      - name: Check Python worker syntax
        run: python3 -m py_compile server/kronos_worker.py

      - name: Check setup script syntax
        run: bash -n scripts/setup-kronos.sh

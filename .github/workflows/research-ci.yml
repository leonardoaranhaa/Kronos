name: Research pipeline validation

on:
  push:
    branches:
      - engineering/p1-data-integrity
      - engineering/foundation-audit
  pull_request:
    branches:
      - engineering/foundation-audit
      - engineering/p1-data-integrity

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline research validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run offline tests
        run: npm test

      - name: Build research application
        run: npm run build

      - name: Check Python worker syntax
        run: python3 -m py_compile server/kronos_worker.py

      - name: Check setup script syntax
        run: bash -n scripts/setup-kronos.sh
